<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Spirits Tracker — Système de Filtres Intégral</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

    <div class="fortnite-container">
        <header class="fn-header">
            <div class="tab-title">COLLECTION INTERACTIVE & APIS</div>
            <h1>SUIVI DES SPRITES & MAÎTRISES</h1>
            <p class="subtitle">Saison Actuelle — Base de données hybride (API Fortnite & Backup Local)</p>
            
            <div class="progress-wrapper">
                <div class="progress-text">Complétion de l'Index : <span id="completionRatio">0 / 0</span></div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="completionBar" style="width: 0%;"></div>
                </div>
            </div>
        </header>

        <!-- Commandes d'acquisition d'images -->
        <section class="fn-controls">
            <div class="upload-actions">
                <button type="button" id="fakeUploadBtn" class="fn-btn btn-blue">📁 IMPORTER CAPTURE</button>
                <input type="file" id="imageUpload" accept="image/*" style="display:none;">
                <button type="button" id="startCamera" class="fn-btn btn-purple">📷 SÉLECTIONNER CAMÉRA</button>
                <button type="button" id="exportBtn" class="fn-btn btn-gold" disabled>📥 EXPORTER L'INDEX (PNG)</button>
            </div>
            
            <div class="camera-wrapper" id="cameraContainer" style="display:none;">
                <video id="video" autoplay playsinline style="width:100%; max-width:500px;"></video>
                <button type="button" id="captureBtn" class="fn-btn btn-danger">CAPTURE ET SCAN AUTOMATIQUE</button>
            </div>
            <div id="statusMessage" class="status-ticker">Initialisation de l'index de combat...</div>
        </section>

        <!-- PANNEL DE FILTRES FORTNITE -->
        <section class="fn-filters-panel">
            <div class="filter-group search-box">
                <input type="text" id="searchBar" placeholder="🔍 Rechercher un esprit..." autocomplete="off">
            </div>
            <div class="filter-group">
                <select id="variantFilter">
                    <option value="all">✨ Toutes les variantes</option>
                </select>
            </div>
            <div class="filter-group toggle-buttons">
                <button type="button" id="toggleHideLocked" class="filter-btn">👁️ Masquer les Bloqués</button>
                <button type="button" id="toggleOnlyMastered" class="filter-btn">👑 Uniquement Maîtrisés</button>
            </div>
        </section>

        <!-- Grille de Collection -->
        <section class="fn-collection-box" id="collectionToExport">
            <div class="box-header">INDEX DE TOUS LES ESPRITS VISIBLES</div>
            <div class="fn-grid" id="spiritsGrid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
